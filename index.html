<html lang="vi">
  <head>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=2.0"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>"
    />
    <title>Hệ Thống Quản Lý Xưởng CK-CNC</title>
    <meta name="description" content="Hệ thống quản lý Xưởng CK-CNC" />
    <meta name="author" content="Son" />

    <meta property="og:title" content="Hệ Thống Quản Lý Xưởng CK-CNC" />
    <meta property="og:description" content="Hệ thống quản lý Xưởng CK-CNC" />
    <meta property="og:type" content="website" />

    <!-- Mobile optimization -->
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      // EMERGENCY URL & CACHE CLEANUP
      (function () {
        // 1. Clear malformed items from localStorage
        function clearMalformedLocalStorage() {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            if (value && (value.includes('%20') || value.includes('http//'))) {
              console.warn('🗑️ Removing malformed localStorage item:', key);
              localStorage.removeItem(key);
            }
          }
        }

        // 2. Unregister all service workers
        function unregisterServiceWorkers() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) {
                registration.unregister();
                console.warn('🛠️ Unregistered ghost ServiceWorker');
              }
            });
          }
        }

        // 3. Check if URL is malformed
        function isMalformedUrl(url) {
          if (/^(blob|data):/i.test(url)) {
            return false;
          }

          return url.includes('%20') ||
            url.includes('http//') ||
            /https?:\/\/[^/]/i.test(url) === false && /https?:/i.test(url) ||
            url.includes(' ') ||
            (url.match(/https?:\/\//gi) || []).length > 1;
        }

        // 4. Fix malformed URL
        function fixMalformedUrl(url) {
          let fixedUrl = url.replaceAll('%20', '').replaceAll(/[\s\uFEFF\xA0]+/g, '');

          const httpMatches = fixedUrl.match(/https?:\/\//gi) || [];
          if (httpMatches.length > 1 || fixedUrl.includes('http//') || fixedUrl.includes('http:/')) {
            const lastHttpIndex = fixedUrl.toLowerCase().lastIndexOf('http');
            if (lastHttpIndex >= 0) {
              fixedUrl = fixedUrl.substring(lastHttpIndex);
            }
          }

          if (fixedUrl.toLowerCase().startsWith('http')) {
            fixedUrl = fixedUrl.replace(/^(https?)[^a-z0-9]+/i, '$1://');
          } else if (fixedUrl.length > 0) {
            fixedUrl = 'https://' + fixedUrl;
          }

          fixedUrl = fixedUrl.replace(/^(https?:\/\/)[^a-z0-9]+/i, '$1');

          const finalHttpMatches = fixedUrl.match(/https?:\/\//gi) || [];
          if (finalHttpMatches.length > 1) {
            const lastHttp = fixedUrl.toLowerCase().lastIndexOf('http');
            fixedUrl = fixedUrl.substring(lastHttp);
          }

          return fixedUrl;
        }

        // 5. Handle fetch with fixed URL
        function handleFetchWithFixedUrl(originalFetch, input, init, fixedUrl) {
          if (typeof input === 'string') {
            return originalFetch.call(this, fixedUrl, init);
          } else if (input instanceof URL) {
            return originalFetch.call(this, fixedUrl, init);
          } else if (input instanceof Request) {
            try {
              const newRequest = new Request(fixedUrl, input);
              return originalFetch.call(this, newRequest, init);
            } catch (e) {
              console.error('Failed to clone request with fixed URL:', e);
            }
          }
          return originalFetch.apply(this, arguments);
        }

        // 6. Setup fetch interceptor
        function setupFetchInterceptor() {
          const originalFetch = window.fetch;
          window.fetch = function (input, init) {
            let url = '';
            if (typeof input === 'string') url = input;
            else if (input instanceof URL) url = input.href;
            else if (input && input.url) url = input.url;

            if (isMalformedUrl(url)) {
              const fixedUrl = fixMalformedUrl(url);
              console.error('🚨 FIXED MALFORMED URL:', url, '->', fixedUrl);
              return handleFetchWithFixedUrl.call(this, originalFetch, input, init, fixedUrl);
            }
            return originalFetch.apply(this, arguments);
          };
        }

        clearMalformedLocalStorage();
        unregisterServiceWorkers();
        setupFetchInterceptor();

        console.log('🛡️ Emergency Protection Active');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
